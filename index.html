<!DOCTYPE html>
<html>
<head>
  <title>Wedding Invitation</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f7f2ee;
      margin: 0;
      padding: 0;
    }
    .box {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>💍 Wedding Invitation 💍</h1>
  <p>We joyfully invite you to our wedding</p>
</div>

<div class="box">
  <h2>📅 Date</h2>
  <p>Coming Soon</p>
</div>

<div class="box">
  <h2>📍 Location</h2>
  <p>Add your venue here</p>
</div>

<div class="box">
  <h2>💌 RSVP</h2>
  <p>Please confirm your attendance</p>
</div>

</body>
</html>
